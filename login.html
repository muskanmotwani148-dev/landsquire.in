<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>LandSquire account</title><link rel="stylesheet" href="platform.css"></head><body><main style="margin:auto;max-width:550px"><a href="home.html">← LandSquire home</a><h1>Your property journey.</h1><p>Local website account. Hosted accounts are not connected to the offline APK yet.</p><form id="auth"><label>Name (for new account)<input name="name" autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" minlength="10" maxlength="128" required autocomplete="current-password"></label><button name="action" value="login">Log in</button><button name="action" value="register">Create customer account</button><p id="message" role="status"></p></form><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const message=document.querySelector('#message');message.textContent='Connecting…';try{const response=await fetch('/api/'+e.submitter.value,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const data=await response.json();if(!response.ok)throw Error(data.error);location.href='platform.html?page=customer'}catch(err){message.textContent=err.message==='Unexpected token'?'Account server unavailable':err.message}};</script></main></body></html>
